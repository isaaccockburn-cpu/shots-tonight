name: Daily update

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC = 6:30 or 7:30 am Eastern, after last night's games are final
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keeps the per-game summaries between runs so each day only downloads new games.
      - uses: actions/cache@v4
        with:
          path: data/games
          key: games-${{ github.run_id }}
          restore-keys: games-

      - name: Build predictions
        run: python build_predictions.py --out predictions.json

      # Keeps a dated copy of every day's predictions in the repository (history/ folder)
      # so they can be scored against real results later.
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "Save predictions for $(date -u +%F)"
          git push

      # Data for the Track record page. If this ever fails, the rest of the site still publishes.
      - name: Build track record
        continue-on-error: true
        run: python backtest.py --json track_record.json --history history --out ""

      - name: Assemble site
        run: |
          mkdir site
          cp index.html track.html predictions.json site/
          cp track_record.json site/ || true
          cp calibration.json site/ || true

      # Publishes the site by pushing it to a "gh-pages" branch (Pages then serves that branch).
      - name: Publish site
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site for $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
