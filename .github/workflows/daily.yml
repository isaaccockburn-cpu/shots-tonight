name: Daily update

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC = 6:30 or 7:30 am Eastern, after last night's games are final
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keeps the per-game summaries between runs so each day only downloads new games.
      - uses: actions/cache@v4
        with:
          path: data/games
          key: games-${{ github.run_id }}
          restore-keys: games-

      - name: Build predictions
        run: python build_predictions.py --out predictions.json

      - name: Assemble site
        run: |
          mkdir site
          cp index.html predictions.json site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
